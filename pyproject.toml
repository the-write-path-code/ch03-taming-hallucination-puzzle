[project]
name = "ch03-taming-hallucination-puzzle"
version = "0.1.0"
description = "Chapter 3 source repo: retrieval design, semantic matching, and hybrid search for taming RAG hallucinations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
local-bge-m3 = [
    "torch>=2.4.0",
    "FlagEmbedding>=1.2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_core"]
